server:
  port: 8080

spring:
  application:
    name: extraction-service
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  jackson:
    default-property-inclusion: always

extractor:
  ocr:
    base-url: ${OCR_BASE_URL:http://localhost:8000}
    timeout: 60s
  llm:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:qwen2.5:3b}
    # Auf CPU dauert der erste Aufruf (Modell laden) deutlich länger
    timeout: 180s
  min-ocr-confidence: 70

management:
  endpoints:
    web:
      exposure:
        include: health
