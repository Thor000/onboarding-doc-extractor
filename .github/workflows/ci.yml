name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  extraction-service:
    name: Java · extraction-service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extraction-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Tests
        run: mvn -B test

  ocr-service:
    name: Python · ocr-service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ocr-service
    steps:
      - uses: actions/checkout@v4
      - name: Tesseract installieren
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-deu tesseract-ocr-eng
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ocr-service/requirements*.txt
      - name: Abhängigkeiten
        run: pip install -r requirements-dev.txt
      - name: Tests
        run: pytest -v

  docker:
    name: Docker-Images bauen
    runs-on: ubuntu-latest
    needs: [extraction-service, ocr-service]
    steps:
      - uses: actions/checkout@v4
      - name: Images bauen (ohne Ollama-Modell)
        run: docker compose build ocr-service extraction-service
